{% extends 'base.html' %}

{% block content %}

<h1>

    {{ category.name }}

</h1>

<hr>

<div class="row">

    {% for post in posts %}

        <div class="col-md-4 mb-4">

            <div class="card h-100">

                <img
                    src="{{ post.image.url }}"
                    class="card-img-top"
                    style="height:250px; object-fit:cover;"
                >

                <div class="card-body">

                    <h5>

                        {{ post.title }}

                    </h5>

                    <a
                        href="{% url 'blog:blog_detail' post.slug %}"
                        class="btn btn-success"
                    >
                        Read More
                    </a>

                </div>

            </div>

        </div>

    {% endfor %}

</div>

{% endblock %}
