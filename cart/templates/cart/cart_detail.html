{% extends 'base.html' %}

{% block content %}

<h2>

    Shopping Cart

</h2>

<table class="table">

    <thead>

        <tr>

            <th>Product</th>

            <th>Qty</th>

            <th>Price</th>

            <th>Subtotal</th>

            <th></th>

        </tr>

    </thead>

    <tbody>

        {% for item in items %}

        <tr>

            <td>

                {{ item.product.name }}

            </td>

            <td>

                {{ item.quantity }}

            </td>

            <td>

                ₦{{ item.product.price }}

            </td>

            <td>

                ₦{{ item.subtotal }}

            </td>

            <td>

                <a

                href="{% url 'remove_from_cart' item.product.id %}"

                class="btn btn-danger btn-sm"

                >

                    Remove

                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

<h4>

    Total: ₦{{ total }}

</h4>

<div class="mt-4">

    <a href="/products/"
       class="btn btn-secondary">

        Continue Shopping

    </a>

    <a href = "{% url 'checkout' %}"
       class="btn btn-success">

        Proceed to Checkout

    </a>

</div>

{% endblock %}
