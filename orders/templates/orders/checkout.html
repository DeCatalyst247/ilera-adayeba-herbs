{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

<h2>

Checkout

</h2>

<hr>

<table class="table">

<thead>

<tr>

<th>Product</th>

<th>Qty</th>

<th>Subtotal</th>

</tr>

</thead>

<tbody>

{% for item in items %}

<tr>

<td>

{{ item.product.name }}

</td>

<td>

{{ item.quantity }}

</td>

<td>

₦{{ item.subtotal }}

</td>

</tr>

{% endfor %}

</tbody>

</table>

<h4>

Total:

₦{{ total }}

</h4>

<hr>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button

class="btn btn-success"

>

Place Order

</button>

</form>

</div>

{% endblock %}
