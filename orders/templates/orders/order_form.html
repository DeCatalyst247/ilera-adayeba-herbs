{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <h2>

        Order

        {{ product.name }}

    </h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="btn btn-success"
        >

            Place Order

        </button>

    </form>

</div>

{% endblock %}
