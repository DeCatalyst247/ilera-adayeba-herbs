{% extends 'base.html' %}

{% block content %}

<h2>

    {{ category.name }}

</h2>

<hr>

<div class="row">

    {% for product in products %}

        <div class="col-md-4">

            <div class="card mb-3">

                <img
                    src="{{ product.image.url }}"
                    class="card-img-top"
                >

                <div class="card-body">

                    <h5>

                        {{ product.name }}

                    </h5>

                </div>

            </div>

        </div>

    {% endfor %}

</div>

{% endblock %}
