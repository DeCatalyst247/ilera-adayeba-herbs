{% extends 'base.html' %}

{% block content %}


<form method="GET">

    <div class="input-group mb-4">

        <input

            type="text"

            name="q"

            class="form-control"

            placeholder="Search products..."

        >

        <button
            class="btn btn-success"
        >

            Search

        </button>

    </div>

</form>
<h1 class="mb-4">

    Our Products

</h1>

<div class="row">

    {% for product in products %}

        <div class="col-md-4 mb-4">

            <div class="card h-100">

                <img
                    src="{{ product.image.url }}"
                    class="card-img-top"
                    style="
                    height: 250px;
                    object-fit: cover;"
                    alt="{{ product.name }}"
                >

                <div class="card-body">

                    <h5>

                        {{ product.name }}

                    </h5>

                    <p>

                        ₦{{ product.price }}

                    </p>

                    <a
                        href="{% url 'products:product_detail' product.slug %}"
                        class="btn btn-success"
                    >
                        View Product
                    </a>

                </div>

            </div>

        </div>

    {% empty %}

        <p>
            No products available.
        </p>

    {% endfor %}

</div>

{% endblock %}
